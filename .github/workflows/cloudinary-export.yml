name: One-off Cloudinary export

# Temporary: copies the site's images from Cloudinary into public/images, commits them, and deletes this file.
on:
  push:
    branches: [claude/project-thread-cpelki]
    paths: [.github/workflows/cloudinary-export.yml]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/project-thread-cpelki

      - name: Download
        run: |
          set -euo pipefail
          base=https://res.cloudinary.com/dluezegi8/image/upload
          failed=0
          get() {
            mkdir -p "$(dirname "$2")"
            code=$(curl -sSL --retry 4 -D /tmp/h -o "$2" -w '%{http_code}' "$1")
            echo "$code $1"
            if [ "$code" != 200 ]; then grep -i '^x-cld-error' /tmp/h || true; rm -f "$2"; failed=1; fi
          }
          for slug in connect-deezer-api-to-nextjs fr-connect-deezer-api-to-nextjs le-bon-temperament-build-log fr-le-bon-temperament-build-log living-in-france-coding-in-germany fr-living-in-france-coding-in-germany nextjs-request-ip-removed fr-nextjs-request-ip-removed typescript-7-eslint-to-oxlint fr-typescript-7-eslint-to-oxlint; do
            get "$base/v1/images/upload/thomasmoserdev.com/blog/$slug/header.jpg" "public/images/blog/$slug/header.jpg"
          done
          # Stored as WebP: converted to JPEG once (next/og only decodes PNG and JPEG).
          for slug in connect-spotify-api-to-nextjs fr-connect-spotify-api-to-nextjs; do
            get "$base/f_jpg,q_90/v1/images/upload/thomasmoserdev.com/blog/$slug/header.jpg" "public/images/blog/$slug/header.jpg"
          done
          for id in v2/la-minute-cine v2/nous-deux v2/lebontemperament v2/habit-forge v2/urlshortener v2/cristina-designs v2/curefab; do
            get "$base/v1/images/upload/thomasmoserdev.com/projects/$id.jpg" "public/images/projects/$id.jpg"
          done
          # Stored as PNG: converted to JPEG once, like the other screenshots.
          for id in v2/taylorssecretgarden-2026 chatgptv2 stopviolence musescore; do
            get "$base/f_jpg,q_90/v1/images/upload/thomasmoserdev.com/projects/$id.jpg" "public/images/projects/$id.jpg"
          done
          file public/images/blog/*/header.jpg public/images/projects/*.jpg public/images/projects/v2/*.jpg
          du -sh public/images
          exit $failed

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/cloudinary-export.yml
          git add public/images
          git commit -m "chore(media): copy the site's images from Cloudinary into public/images" -m "One-off export by the temporary workflow, which removes itself in this commit."
          git push origin HEAD:claude/project-thread-cpelki
